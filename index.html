<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>纯道路地图</title>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="道路地图">
    <link rel="stylesheet"
          href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #locate {
            position: absolute;
            right: 15px;
            bottom: 30px;
            z-index: 10;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;
            background: white;

            font-size: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
        }
    </style>
</head>

<body>

<div id="map"></div>

<button id="locate">◎</button>

<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>

<script>
    // ==============================
    // 只需要修改这里
    // ==============================

    const MAPTILER_KEY = "Uxbn49dgFcGgwxu2yKhj";

    const STYLE_ID =
        "019ffa88-4a15-77d3-916e-1443337c4b58";

    const STYLE_URL =
        `https://api.maptiler.com/maps/${STYLE_ID}/style.json?key=${MAPTILER_KEY}`;


    // ==============================
    // 创建地图
    // ==============================

    const map = new maplibregl.Map({
        container: "map",
        style: STYLE_URL,

        center: [108.32, 22.82],
        zoom: 12,

        attributionControl: true
    });


    // 缩放按钮
    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


    // ==============================
    // GPS定位
    // ==============================

// ==============================
// GPS 定位
// ==============================

let userMarker = null;
let accuracyCircle = null;

document.getElementById("locate").onclick = function () {

    if (!navigator.geolocation) {
        alert("当前设备不支持 GPS 定位");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const lng = position.coords.longitude;
            const lat = position.coords.latitude;
            const accuracy = position.coords.accuracy;

            // 删除旧位置
            if (userMarker) {
                userMarker.remove();
            }

            // 创建当前位置点
            const el = document.createElement("div");

            el.style.width = "18px";
            el.style.height = "18px";
            el.style.borderRadius = "50%";
            el.style.background = "#1976ff";
            el.style.border = "3px solid white";
            el.style.boxShadow = "0 1px 6px rgba(0,0,0,.4)";
            el.style.boxSizing = "border-box";

            userMarker = new maplibregl.Marker({
                element: el
            })
            .setLngLat([lng, lat])
            .addTo(map);

            // 移动地图到当前位置
            map.flyTo({
                center: [lng, lat],
                zoom: 16,
                essential: true
            });

            console.log(
                "GPS:",
                lat,
                lng,
                "精度:",
                Math.round(accuracy) + " 米"
            );
        },

        function(error) {

            switch (error.code) {

                case error.PERMISSION_DENIED:
                    alert("你拒绝了定位权限，请在系统设置中允许此网页使用位置。");
                    break;

                case error.POSITION_UNAVAILABLE:
                    alert("暂时无法获取 GPS 位置。");
                    break;

                case error.TIMEOUT:
                    alert("GPS 定位超时，请稍后再试。");
                    break;

                default:
                    alert("定位失败：" + error.message);
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000
        }
    );
};
</script>

</body>
</html>
